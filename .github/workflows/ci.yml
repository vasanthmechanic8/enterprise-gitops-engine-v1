name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-secure:
    name: Build, Scan, and Publish Container
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Local Image for Auditing
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: enterprise-app:local

    - name: Run Trivy Security Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'enterprise-app:local'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Package and Push Final Secure Container
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/enterprise-app:latest
          ghcr.io/${{ github.repository }}/enterprise-app:${{ github.sha }}
